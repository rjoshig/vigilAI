# Alembic configuration. The URL is not set here on purpose: it comes from
# DATABASE_URL in .env so migrations run against whichever backend is configured
# (ADR-017). Migrations must stay portable: additive changes only, no Postgres-only DDL.
[alembic]
script_location = src/greenlight_ai/db/migrations
prepend_sys_path = src
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
